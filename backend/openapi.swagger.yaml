      - HTTPBearer: []
      x-user-stories:
      - Platform-Enabler
      x-sprint: Sprint 1
      x-implementation: backend/app/auth/router.py
  /auth/google:
    get:
      tags:
      - Authentication
      summary: Google Login
      description: 'Initiate Google OAuth flow.

        Redirects the browser to Google''s consent/login page.


        **User-story mapping:** Authentication, authorization, and platform access.


        **Implemented in:** `backend/app/auth/router.py`'
      operationId: google_login_auth_google_get
