openapi: 3.1.0
info:
  title: SocietySync API
  description: Complete Sprint 1 and Sprint 2 REST contract for SocietySync. Every operation includes implementation
    ownership, Milestone 1 user-story mapping, and reusable error responses. Legacy Sprint 1 aliases are retained
    for backward compatibility while `/api/v1` is the canonical contract.
  version: 2.0.0-sprint2
  x-milestone: Milestone 4
  x-user-stories:
    US-5.1.1: Resident payment with downloadable receipt.
    US-5.1.2: Automated reminders before maintenance dues.
    US-5.1.3: President dashboard for collected and pending funds.
    US-5.1.4: Automatic staggered late-fee calculation.
    US-5.2.1: Categorized complaints with geo-tagged attachments.
    US-5.2.2: Known-issues board to avoid duplicate complaints.
    US-5.2.3: Assign complaints to staff with an SLA.
    US-5.2.4: Staff update assigned work from a mobile workflow.
    US-5.3.1: Security records helper entry and exit digitally.
    US-5.3.2: Resident approval notification for unannounced visitors.
    US-5.4.1: Real-time amenity availability and conflict-free booking.
    US-5.4.2: President configures fair weekly booking limits.
    US-5.4.3: Booking confirmation with a verifiable identifier.
    US-5.5.1: Targeted block or flat notifications.
    US-5.5.2: Event RSVP with live attendance count.
    US-5.5.3: Transparent community polls.
    US-5.6.1: Monthly analysis of recurring complaint categories.
    US-5.6.2: Amenity utilization analysis for resource planning.
  x-integrated-apis:
  - name: Google OAuth 2.0
    purpose: Authorization, token exchange, and verified profile retrieval
    endpoints:
    - https://accounts.google.com/o/oauth2/v2/auth
    - https://oauth2.googleapis.com/token
    - https://www.googleapis.com/oauth2/v2/userinfo
  - name: Twilio Messaging API
    purpose: Delivery of six-digit SocietySync OTP messages
    endpoint: Twilio SDK client.messages.create
paths:
  /auth/signup:
    post:
      tags:
      - Authentication
      summary: Signup
      description: 'Register a new user. Default role is **flat_owner** (resident member).

        An admin can later elevate the role.


        **User-story mapping:** Authentication, authorization, and platform access.


        **Implemented in:** `backend/app/auth/router.py`'
      operationId: signup_auth_signup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/ServerError'
      x-user-stories:
      - Platform-Enabler
      x-sprint: Sprint 1
      x-implementation: backend/app/auth/router.py
  /auth/login/password:
    post:
      tags:
      - Authentication
      summary: Login Password
      description: 'Authenticate with email + password. Issues access + refresh tokens.


        **User-story mapping:** Authentication, authorization, and platform access.


        **Implemented in:** `backend/app/auth/router.py`'
      operationId: login_password_auth_login_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/ServerError'
      x-user-stories:
      - Platform-Enabler
      x-sprint: Sprint 1
      x-implementation: backend/app/auth/router.py
  /auth/otp/request:
    post:
      tags:
      - Authentication
      summary: Request Otp
      description: 'Send a 6-digit OTP to the given phone number.

        Rate-limited to 3 requests per 10 minutes per IP.


        **User-story mapping:** Authentication, authorization, and platform access.


        **Implemented in:** `backend/app/auth/router.py`'
      operationId: request_otp_auth_otp_request_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequestSchema'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/ServerError'
      x-user-stories:
      - Platform-Enabler
      x-sprint: Sprint 1
      x-implementation: backend/app/auth/router.py
  /auth/otp/verify:
    post:
      tags:
      - Authentication
      summary: Verify Otp
      description: 'Verify OTP and issue access + refresh tokens on success.


        **User-story mapping:** Authentication, authorization, and platform access.


        **Implemented in:** `backend/app/auth/router.py`'
      operationId: verify_otp_auth_otp_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/ServerError'
      x-user-stories:
      - Platform-Enabler
      x-sprint: Sprint 1
      x-implementation: backend/app/auth/router.py
  /auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh Token
      description: 'Silently refresh the access token using the HttpOnly refresh-token cookie.

        Implements token rotation — old refresh token is revoked.


        **User-story mapping:** Authentication, authorization, and platform access.


        **Implemented in:** `backend/app/auth/router.py`'
      operationId: refresh_token_auth_refresh_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/ServerError'
      x-user-stories:
      - Platform-Enabler
      x-sprint: Sprint 1
      x-implementation: backend/app/auth/router.py
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: Logout
      description: 'Revoke refresh token and clear auth cookies.


        **User-story mapping:** Authentication, authorization, and platform access.


        **Implemented in:** `backend/app/auth/router.py`'
      operationId: logout_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/ServerError'
      x-user-stories:
      - Platform-Enabler
      x-sprint: Sprint 1
      x-implementation: backend/app/auth/router.py
  /auth/me:
    get:
      tags:
      - Authentication
      summary: Get Me
      description: 'Return the authenticated user''s profile and roles.


        **User-story mapping:** Authentication, authorization, and platform access.


        **Implemented in:** `backend/app/auth/router.py`'
      operationId: get_me_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMeResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/ServerError'
