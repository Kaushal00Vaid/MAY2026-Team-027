      x-sprint: Sprint 1
      x-implementation: backend/app/auth/router.py
  /auth/google/callback:
    get:
      tags:
      - Authentication
      summary: Google Callback
      description: "Handle the OAuth callback from Google.\n\n- Exchanges the authorization code for tokens.\n-\
        \ Looks up or creates the application user.\n- For new users (profile incomplete): redirects to /complete-profile\
        \ with\n  a short-lived pending token.\n- For returning users (profile complete): issues full tokens and\
        \ redirects\n  to the frontend success page.\n\n**User-story mapping:** Authentication, authorization, and\
        \ platform access.\n\n**Implemented in:** `backend/app/auth/router.py`"
      operationId: google_callback_auth_google_callback_get
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
          title: Code
      - name: error
        in: query
        required: false
        schema:
          type: string
          title: Error
      - name: state
        in: query
        required: false
        schema:
          type: string
          title: State
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/ServerError'
      x-user-stories:
      - Platform-Enabler
      x-sprint: Sprint 1
      x-implementation: backend/app/auth/router.py
  /auth/complete-profile:
    post:
      tags:
      - Authentication
      summary: Complete Profile
      description: 'Complete the Google OAuth user''s profile.


        Requires a short-lived pending_profile Bearer token (issued at callback).

        On success, issues a full access + refresh token pair.


        **User-story mapping:** Authentication, authorization, and platform access.


        **Implemented in:** `backend/app/auth/router.py`'
