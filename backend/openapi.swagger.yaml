  # ── Finance ─────────────────────────────────────────────────────────────────

  /api/finance/transactions:
    get:
      tags: [Finance]
      summary: List recent transactions
      operationId: get_transactions
      description: |
        Returns society financial transactions ordered by date (newest first).
        Optionally filter by type (income or expense). Supports pagination.
        **Requires role:** admin, super_admin, or committee_member.
        User Stories: US-11, US-12, US-13
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: query
          required: false
          description: "Filter by transaction type"
          schema:
            type: string
            enum: [income, expense]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

    post:
      tags: [Finance]
      summary: Record a new transaction
      operationId: create_transaction
      description: |
        Records a new income or expense transaction for the society.
        Amount must be positive; direction is expressed via `type`.
        **Requires role:** admin, super_admin, or committee_member.
        User Stories: US-11, US-12
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreate'
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
